<div class="login-wrapper">
  <mat-card class="login-card">
    <mat-card-header>
      <div class="login-logo">
        <mat-icon>gavel</mat-icon>
      </div>
      <mat-card-title>e-Pravosuđe</mat-card-title>
      <mat-card-subtitle>Molimo prijavite se na sistem</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      <form class="login-form">
        <mat-form-field appearance="outline">
          <mat-label>Korisničko ime ili Email</mat-label>
          <input matInput placeholder="admin@pravosudje.rs">
          <mat-icon matSuffix>person</mat-icon>
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Lozinka</mat-label>
          <input matInput type="password" placeholder="••••••••">
          <mat-icon matSuffix>lock</mat-icon>
        </mat-form-field>

        <button mat-raised-button color="primary" class="login-button" routerLink="/home">
          PRIJAVI SE
        </button>
      </form>
    </mat-card-content>

    <mat-card-footer>
      <p class="footer-text">Zaboravljena lozinka? Kontaktirajte IT podršku.</p>
    </mat-card-footer>
  </mat-card>
</div>
