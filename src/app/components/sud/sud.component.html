<div class="container mat-elevation-z8">
  <div class="container-header">
    <mat-icon class="header-icon">account_balance</mat-icon>
    <h2 class="header-title">UPRAVLJANJE SUDOVIMA</h2>
  </div>

  <mat-form-field appearance="outline" class="search-field">
    <mat-label>Pretraga sudova...</mat-label>
    <input matInput (keyup)="applyFilter($event)" placeholder="Pretraga">
    <mat-icon matSuffix>search</mat-icon>
  </mat-form-field>

  <mat-table [dataSource]="dataSource" matSort>
    <ng-container matColumnDef="id">
      <mat-header-cell *matHeaderCellDef mat-sort-header>ID</mat-header-cell>
      <mat-cell *matCellDef="let row">{{row.id}}</mat-cell>
    </ng-container>

    <ng-container matColumnDef="naziv">
      <mat-header-cell *matHeaderCellDef mat-sort-header>NAZIV</mat-header-cell>
      <mat-cell *matCellDef="let row">{{row.naziv}}</mat-cell>
    </ng-container>

    <ng-container matColumnDef="adresa">
      <mat-header-cell *matHeaderCellDef mat-sort-header>ADRESA</mat-header-cell>
      <mat-cell *matCellDef="let row">{{row.adresa}}</mat-cell>
    </ng-container>

    <ng-container matColumnDef="actions">
      <mat-header-cell *matHeaderCellDef>
        <button mat-icon-button color="primary" (click)="openDialog(1)">
          <mat-icon>add</mat-icon>
        </button>
      </mat-header-cell>
      <mat-cell *matCellDef="let row">
        <button mat-icon-button color="accent" (click)="openDialog(2, row)"><mat-icon>edit</mat-icon></button>
        <button mat-icon-button color="warn" (click)="openDialog(3, row)"><mat-icon>delete</mat-icon></button>
      </mat-cell>
    </ng-container>

    <mat-header-row *matHeaderRowDef="displayedColumns"></mat-header-row>
    <mat-row *matRowDef="let row; columns: displayedColumns;"></mat-row>
  </mat-table>
  <mat-paginator [pageSizeOptions]="[5, 10, 20]"></mat-paginator>
</div>
