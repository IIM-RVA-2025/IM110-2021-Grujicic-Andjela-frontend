<mat-toolbar color="primary" *ngIf="router.url !== '/login' && router.url !== '/'" class="main-header">
  <div class="brand">
    <mat-icon>gavel</mat-icon>
    <span>E-PRAVOSUĐE</span>
  </div>
  <span class="spacer"></span>
  <nav class="nav-links">
    <button mat-button routerLink="/home" routerLinkActive="active-link">POČETNA</button>
    <button mat-button routerLink="/sud" routerLinkActive="active-link">SUDOVI</button>
    <button mat-button routerLink="/rociste" routerLinkActive="active-link">ROČIŠTA</button>
    <button mat-button routerLink="/predmet" routerLinkActive="active-link">PREDMETI</button>
    <button mat-button routerLink="/ucesnik" routerLinkActive="active-link">UČESNICI</button>
    
    <button mat-icon-button routerLink="/login" title="Odjava">
      <mat-icon>logout</mat-icon>
    </button>
  </nav>
</mat-toolbar>

<main class="content-area">
  <router-outlet></router-outlet>
</main>
